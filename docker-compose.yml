# Coolify: docker-compose-App. KEINE Ports, KEINE Domain, KEIN networks-Block
# (implizites Projekt-Default-Netz — Coolify-Regel gegen DNS-Alias-Kollisionen).
# App-Environment injiziert (nicht im Repo).
services:
  audit-scanner:
    build:
      context: .
    image: audit-scanner:latest
    container_name: audit-scanner
    restart: unless-stopped
    environment:
      GH_TOKEN: ${GH_TOKEN}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      ENABLE_FIX_PRS: ${ENABLE_FIX_PRS:-0}
      SKIP_REPOS: ${SKIP_REPOS:-}
      DEEPINFRA_API_KEY: ${DEEPINFRA_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-zai-org/GLM-5.3-Flash}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepinfra.com/v1/openai}
      # Cron in Container-Zeit (TZ=Europe/Berlin im Image): 16:00 Ortszeit.
      CRON_SCHEDULE: ${CRON_SCHEDULE:-0 16 * * *}
      # Soaking: Updates erst nach N Tagen (Package-Poisoning-Schutz). 0 = aus.
      UPDATE_MIN_AGE_DAYS: ${UPDATE_MIN_AGE_DAYS:-3}
      # Nightly/Canary-Abweichungen im Report zeigen (Default: aus).
      SHOW_EXOTIC_PRERELEASES: ${SHOW_EXOTIC_PRERELEASES:-0}
      # Renovate-Analyse (v1.7.0): 0 = aus. Renovate legt NIE eigene PRs an –
      # seine Update-Vorschläge landen im gebündelten cve-audit/pins-<datum>-PR.
      ENABLE_RENOVATE: ${ENABLE_RENOVATE:-0}
      RENOVATE_BIN: ${RENOVATE_BIN:-renovate}
    volumes:
      - audit-reports:/app/reports   # Report-JSON/MD + .heartbeat
      - audit-cache:/app/.cache      # Trivy-DB (nur 1× laden statt jede Nacht)
      - audit-logs:/app/logs

volumes:
  audit-reports:
  audit-cache:
  audit-logs:
